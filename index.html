<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Knoppen</title>
  <style>
    body {
      background: #0f172a;
      color: #fff;
      font-family: system-ui, sans-serif;
      padding: 40px;
    }
    button {
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #e11d48;
      color: #fff;
      cursor: pointer;
      margin-right: 10px;
    }
    #log {
      margin-top: 20px;
      padding: 16px;
      background: #1e293b;
      border-radius: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Vercel & Knoppen Check</h1>
  <button type="button" onclick="klikTest('Start Race')">Klik Start Race</button>
  <button type="button" onclick="klikTest('Bocht Toevoegen')">Klik Bocht Toevoegen</button>
  <div id="log">Nog niet geklikt...</div>

  <script>
    var teller = 0;
    function klikTest(naam) {
      teller = teller + 1;
      document.getElementById('log').textContent = 'WERKT! Je klikte op "' + naam + '" (klik #' + teller + ')';
    }
  </script>
</body>
</html>
